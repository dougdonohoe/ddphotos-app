# Dependabot version updates: routine bumps, opened as PRs.
version: 2

updates:
  # All Maven modules build from the parent pom in code/.
  - package-ecosystem: maven
    directory: /code
    schedule:
      interval: weekly

  # The actions in .github/workflows. They release new majors a few times a year,
  # so monthly checks are enough, and one grouped PR covers them all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
