   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs10" />
  <sodipodi:namedview
     id="namedview10"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.5578819"
     inkscape:cx="133.89985"
     inkscape:cy="114.93885"
     inkscape:window-width="1434"
     inkscape:window-height="791"
     inkscape:window-x="0"
     inkscape:window-y="31"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg10" />
  <title
     id="title1">DD Photos</title>
  <desc
     id="desc1">DD Photos logo — SLR camera with DD lens monogram and PHOTOS wordmark</desc>
  <!-- Camera body: y=22, height=162, bottom=184, center y=103 -->
  <rect
     x="0"
     y="22"
     width="270"
     height="162"
     rx="14"
     fill="#3730A3"
     id="rect1" />
  <!-- Viewfinder bump -->
  <rect
     x="50"
     y="0"
     width="88"
     height="26"
     rx="7"
     fill="#4338CA"
     id="rect2" />
  <!-- Body panel line -->
  <line
     x1="0"
     y1="50"
     x2="270"
     y2="50"
     stroke="#2E2780"
     stroke-width="1"
     opacity="0.4"
     id="line2" />
  <!-- Indicator lights -->
  <circle
     cx="17"
     cy="37"
     r="3.5"
     fill="#7C72F0"
     opacity="0.8"
     id="circle2" />
  <circle
     cx="28"
     cy="37"
     r="2.5"
     fill="#A5B4FC"
     opacity="0.5"
     id="circle3" />
  <!--
    Lens, concentric on the camera body center (135,103).
    Barrel R=71 + 1.5 half-stroke = 72.5, so the outer edge sits at y=30.5
    and y=175.5 - an even 8.5px gap to the body top (22) and bottom (184).
  -->
  <circle
     cx="135"
     cy="103"
     r="71"
     fill="#1a186b"
     stroke="#6d68d8"
     stroke-width="3"
     id="circle4" />
  <circle
     cx="135"
     cy="103"
     r="61"
     fill="none"
     stroke="#4f4ab5"
     stroke-width="1.5"
     id="circle5" />
  <!-- Glass: same radius as the DD, which sits flush on top of it -->
  <circle
     cx="135"
     cy="103"
     r="55"
     fill="#0f0e55"
     id="circle6" />
  <!--
    DD monogram, concentric on the lens at (135,103).

    Each D is one circular segment: the outer disc cut by a vertical chord at
    the gap. The stem is then the band between the counter chord and the gap
    chord, and it terminates ON the outer arc - so the silhouette curves all
    the way round instead of ending in a flat cap. Union of the two segments
    is a true R=55 circle split by the 2px gap.

      outer R=55, gap chords at x=134 / x=136  -> y = 103 +/- sqrt(55^2-1^2)
      counter R=36, stem 5px, chords at x=129 / x=141
                                              -> y = 103 +/- sqrt(36^2-6^2)
    Both sweeps are under 180 degrees, so large-arc-flag is 0 throughout.
  -->
  <!-- LEFT reversed D -->
  <path
     d="M 134,48.00909 A 55,55 0 0 0 134,157.99091 Z"
     fill="#a5b4fc"
     id="path7" />
  <path
     d="M 129,67.50352 A 36,36 0 0 0 129,138.49648 Z"
     fill="#0f0e55"
     id="path8" />
  <!-- RIGHT normal D -->
  <path
     d="M 136,48.00909 A 55,55 0 0 1 136,157.99091 Z"
     fill="#c7d2fe"
     id="path9" />
  <path
     d="M 141,67.50352 A 36,36 0 0 1 141,138.49648 Z"
     fill="#0f0e55"
     id="path10" />
  <!--
    PHOTOS wordmark, outlined from Helvetica Neue Medium 26px so that rendering
    does not depend on the installed fonts or on a renderer honouring
    textLength. Ink box: x 26.417..243.583 (centered on 135), baseline y=216.44.
    Do not edit by hand - see logo/icon.md to regenerate.

    DO NOT trim the viewBox height to the ink. The 230 height is deliberate:
    it puts equal whitespace above and below the wordmark.
      camera bottom 184 -> ink top    197.434  = 13.434
      ink bottom 216.882 -> viewBox   230      = 13.118
    The apparently empty band under the wordmark IS the bottom margin.
  -->
