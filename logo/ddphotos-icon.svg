<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 142 142"
   width="142"
   height="142"
   version="1.1"
   id="svg7"
   sodipodi:docname="ddphotos-icon.svg"
   inkscape:version="1.4.3 (0d15f750, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs7" />
  <sodipodi:namedview
     id="namedview7"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="2.9295775"
     inkscape:cx="68.951923"
     inkscape:cy="70.317308"
     inkscape:window-width="1456"
     inkscape:window-height="895"
     inkscape:window-x="0"
     inkscape:window-y="31"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg7" />
  <title
     id="title1">DD Photos icon</title>
  <desc
     id="desc1">DD Photos icon — lens monogram only, for small sizes and app icons</desc>
  <!--
    Lens-only icon: circle with DD inside, no camera body, no wordmark.
    Everything is concentric on (71,71).
      Outer barrel R=68 + 1.5 half-stroke = 69.5, leaving a 1.5px margin
      Inner ring    R=58
      Glass         R=52 - same radius as the DD, which sits flush on top
  -->
  <!-- Outer barrel -->
  <circle
     cx="71"
     cy="71"
     r="68"
     fill="#1a186b"
     stroke="#6D68D8"
     stroke-width="3"
     id="circle1" />
  <!-- Inner ring -->
  <circle
     cx="71"
     cy="71"
     r="58"
     fill="none"
     stroke="#4f4ab5"
     stroke-width="1.5"
     id="circle2" />
  <!-- Glass -->
  <circle
     cx="71"
     cy="71"
     r="52"
     fill="#0f0e55"
     id="circle3" />
  <!--
    DD monogram, concentric on the lens at (71,71).

    Each D is one circular segment: the outer disc cut by a vertical chord at
    the gap. The stem is then the band between the counter chord and the gap
    chord, and it terminates ON the outer arc - so the silhouette curves all
    the way round instead of ending in a flat cap. Union of the two segments
    is a true R=52 circle split by the 2px gap.

      outer R=52, gap chords at x=70 / x=72  -> y = 71 +/- sqrt(52^2-1^2)
      counter R=34, stem 4px, chords at x=66 / x=76
                                             -> y = 71 +/- sqrt(34^2-5^2)
    Both sweeps are under 180 degrees, so large-arc-flag is 0 throughout.
  -->
  <!-- LEFT reversed D -->
  <path
     d="M 70,19.00962 A 52,52 0 0 0 70,122.99038 Z"
     fill="#a5b4fc"
     id="path4" />
  <path
     d="M 66,37.36966 A 34,34 0 0 0 66,104.63034 Z"
     fill="#0f0e55"
     id="path5" />
  <!-- RIGHT normal D -->
  <path
     d="M 72,19.00962 A 52,52 0 0 1 72,122.99038 Z"
     fill="#c7d2fe"
     id="path6" />
  <path
     d="M 76,37.36966 A 34,34 0 0 1 76,104.63034 Z"
     fill="#0f0e55"
     id="path7" />
</svg>
